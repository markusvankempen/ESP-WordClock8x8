; ESP-WordClock8x8 — 8×8 WS2812 English word clock
; Copyright (c) 2026 Markus Van Kempen — MIT
;
; Default target is the M5 Atom S3 Lite. An ESP8266 env is included for
; generic boards (D1 mini, NodeMCU). See README for pin defaults.

[env]
framework = arduino
monitor_speed = 115200
lib_deps =
    adafruit/Adafruit NeoPixel@^1.12.3
    tzapu/WiFiManager@^2.0.17
    knolleary/PubSubClient@^2.8
    bblanchon/ArduinoJson@^7.3.0

[env:atoms3lite]
platform = espressif32@6.5.0
board = esp32-s3-devkitc-1
upload_speed = 921600
board_build.mcu = esp32s3
board_build.f_cpu = 240000000L
board_upload.flash_size = 8MB
board_build.flash_mode = qio
board_build.partitions = partitions/ota_8MB.csv
build_flags =
    -std=gnu++17
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DWM_NODEBUG
    -DWC_BOARD_NAME=\"M5\ Atom\ S3\ Lite\"
    -DWC_LED_PIN=2
    -DWC_BUTTON_PIN=41

[env:esp32]
platform = espressif32@6.5.0
board = esp32dev
upload_speed = 921600
board_build.partitions = min_spiffs.csv
build_flags =
    -std=gnu++17
    -DWM_NODEBUG
    -DWC_BOARD_NAME=\"ESP32\"
    -DWC_LED_PIN=13
    -DWC_BUTTON_PIN=0

[env:esp8266]
platform = espressif8266@4.2.1
board = d1_mini
board_build.ldscript = eagle.flash.4m1m.ld
lib_deps =
    ${env.lib_deps}
    vshymanskyy/Preferences@^2.1.0
build_flags =
    -std=gnu++17
    -DWM_NODEBUG
    -DWC_BOARD_NAME=\"ESP8266\ D1\ mini\"
